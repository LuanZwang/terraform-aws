name: "DEV DEPLOY"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: "prd"
      aws_region: "sa-east-1"
      aws-statefile-s3-bucket: "luanzwang-sa-east-1-terraform-statefile"
      aws-lock-dynamodb-table: "luanzwang-sa-east-1-terraform-lock"
    secrets:
      aws-assume-role-arn: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
